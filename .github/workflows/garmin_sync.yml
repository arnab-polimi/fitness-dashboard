name: Autonomous Garmin Cloud Sync

on:
  schedule:
    # Run at 10:00 AM, 12:00 PM, and 10:00 PM CEST (UTC+2) -> 08:00, 10:00, 20:00 UTC
    - cron: '0 8,10,20 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      workflows: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Garmin Cloud Synchronizer
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python -m src.ingestion.garmin_cloud_sync

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin ${{ github.ref_name }}
          git reset --mixed origin/${{ github.ref_name }}
          git checkout -- .
          git add fitness_data.db
          if git diff --staged --quiet; then
            echo "No new Garmin data to commit."
          else
            git commit -m "Auto-sync: update Garmin activities and health telemetry"
            git push origin HEAD:${{ github.ref_name }}
          fi
