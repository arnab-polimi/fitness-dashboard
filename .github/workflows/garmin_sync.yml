name: Autonomous Garmin Cloud Sync

on:
  schedule:
    # Run every 4 hours at :33 past the hour (UTC) to avoid top-of-the-hour queue delays:
    # 00:33, 04:33, 08:33, 12:33, 16:33, 20:33 UTC
    # (In CEST / UTC+2: 02:33, 06:33, 10:33, 14:33, 18:33, 22:33)
    - cron: '33 */4 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Garmin Cloud Synchronizer
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python -m src.ingestion.garmin_cloud_sync

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cp fitness_data.db /tmp/fitness_data.db
          git fetch origin ${{ github.ref_name }}
          git reset --hard origin/${{ github.ref_name }}
          cp /tmp/fitness_data.db fitness_data.db
          git add fitness_data.db
          if git diff --staged --quiet; then
            echo "No new Garmin data to commit."
          else
            git commit -m "Auto-sync: update Garmin activities and health telemetry"
            git push origin HEAD:${{ github.ref_name }}
          fi
