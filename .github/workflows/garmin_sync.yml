name: Autonomous Garmin Cloud Sync

on:
  schedule:
    # Run every 6 hours automatically (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub web interface anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Garmin Cloud Synchronizer
        env:
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
        run: |
          python -m src.ingestion.garmin_cloud_sync

      - name: Commit and push updated database
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add fitness_data.db
          if git diff --staged --quiet; then
            echo "No new Garmin data to commit."
          else
            git commit -m "Auto-sync: update Garmin activities and health telemetry [skip ci]"
            git push origin master
          fi
